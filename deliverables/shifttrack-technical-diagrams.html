<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />

  <title>ShiftTrack - Diagramas Técnicos</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --ink: #1f2a3d;
      --muted: #5b6f8a;
      --line: #cdd9e7;
      --card: #ffffff;
      --front: #eaf5ff;
      --front-border: #8fc3f7;
      --back: #eefaf1;
      --back-border: #8fd0a0;
      --infra: #fff5e8;
      --infra-border: #f0c78a;
      --accent: #1f7dd6;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 22px 60px;
    }
    h1, h2 {
      margin: 0 0 10px;
      color: #16385d;
    }
    h1 { font-size: 32px; }
    h2 { font-size: 24px; margin-top: 34px; }
    .sheet {
      background: var(--card);
      border: 1px solid #d8e3ef;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(22, 55, 91, 0.06);
      margin-top: 16px;
      overflow-x: auto;
    }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 8px 0 18px;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .legend i {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      display: inline-block;
    }

    svg {
      width: 100%;
      min-width: 1100px;
      height: auto;
      display: block;
    }

    .box-title {
      font-size: 15px;
      font-weight: 700;
      fill: #173b61;
    }
    .box-sub {
      font-size: 12px;
      fill: #49607f;
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      fill: #173b61;
    }
    .arrow-label {
      font-size: 12px;
      fill: #456281;
    }
    .small {
      font-size: 11px;
    }
  </style>
</head>
