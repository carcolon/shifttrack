trigger: none
pr: none

pool:
  vmImage: "ubuntu-latest"

parameters:
  - name: maintenanceMode
    displayName: "Enable maintenance mode"
    type: boolean
    default: true
  - name: maintenanceMessage
    displayName: "Maintenance message"
    type: string
    default: "We are under maintenance. Please check back later."

variables:
  - group: shifttrack-web-maintenance


steps:
  - task: NodeTool@0
    displayName: "Use Node 20"
    inputs:
      versionSpec: "20.x"

  - script: |
      npm ci
    displayName: "Install dependencies"

  - script: |
      export VITE_API_BASE="$(VITE_API_BASE)"
      export VITE_ENTRA_TENANT_ID="$(VITE_ENTRA_TENANT_ID)"
      export VITE_ENTRA_CLIENT_ID="$(VITE_ENTRA_CLIENT_ID)"
      export VITE_MAINTENANCE_MODE="${{ parameters.maintenanceMode }}"
      export VITE_MAINTENANCE_MESSAGE="${{ parameters.maintenanceMessage }}"
      npm run build
    displayName: "Build with maintenance toggle"

  - task: AzureStaticWebApp@0
    displayName: "Deploy maintenance build"
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
      app_location: "/"
      api_location: ""
      output_location: "dist"
